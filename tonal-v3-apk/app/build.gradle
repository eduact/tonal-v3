plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tonal.v3'
    compileSdk 34
    defaultConfig {
        applicationId "com.tonal.v3"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "3.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {}
